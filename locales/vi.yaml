  t331: MATRIX_DEVICE_ID ghim device ID ổn định cho E2EE — không có nó, key xoay vòng mỗi lần khởi động và giải mã lịch sử bị hỏng.
  t332: TELEGRAM_WEBHOOK_SECRET bắt buộc khi TELEGRAM_WEBHOOK_URL được đặt — tạo bằng openssl rand -hex 32.
  t333: batch_runner.py --resume khớp nội dung các prompt đã hoàn tất theo text để sắp lại dataset không chạy lại phần đã xong.
  t334: /new bắt đầu session mới ngay tại chỗ (alias /reset) — session ID mới, lịch sử sạch, CLI vẫn mở.
  t335: /clear xóa màn hình terminal VÀ bắt đầu session mới — một phím tắt cho việc reset trực quan.
  t336: /history in hội thoại hiện tại ngay trong màn hình không cần rời CLI — tiện để đọc lại nhanh.
  t337: /save ghi hội thoại hiện tại ra đĩa mà không kết thúc session.
  t338: '/status hiển thị nhanh thông tin session: ID, tiêu đề, model, mức dùng token và thời gian đã trôi.'
  t339: /image <path> đính kèm file ảnh local cho prompt kế tiếp mà không cần dán hay kéo-thả.
  t340: /platforms hiển thị trạng thái gateway và các nền tảng nhắn tin ngay trong chat.
  t341: /commands phân trang toàn bộ danh sách lệnh slash + skill đã cài — hữu ích trên nền tảng không có hoàn thiện tab.
  t342: /toolsets liệt kê mọi toolset khả dụng để bạn biết -t/--toolsets nhận gì.
  t343: /voice tts bật chế độ chỉ TTS — agent trả lời bằng giọng nói nhưng bạn vẫn gõ prompt.
  t344: /reload-skills quét lại ~/.hermes/skills/ để skill thả vào xuất hiện mà không cần khởi động lại session.
  t345: /indicator kaomoji|emoji|unicode|ascii chọn kiểu chỉ báo bận của TUI hiển thị trong lúc agent chạy.
  t346: /debug tải lên gói hỗ trợ (thông tin hệ thống + log) và trả về link chia sẻ — hoạt động cả trong chat.
  t347: 'hermes -z "<prompt>" là dạng one-shot thuần nhất: câu trả lời cuối trên stdout, không gì khác — lý tưởng để pipe trong script.'
  t348: hermes chat --pass-session-id chèn session ID vào system prompt để agent có thể tự tham chiếu.
  t349: hermes chat --image path/to/pic.png đính kèm ảnh local vào một truy vấn -q duy nhất, không cần bước upload riêng.
  t350: hermes chat --ignore-user-config bỏ qua cấu hình người dùng đang hoạt động — báo lỗi tái lập được và lượt chạy CI.
  t351: hermes chat --source tool gắn thẻ các chat chạy chương trình để chúng không làm lộn xộn hermes sessions list.
  t352: hermes dump --show-keys gồm dấu vân tay API key đã che bớt để debug hỗ trợ sâu hơn.
  t353: hermes sessions rename <ID> "new title" đổi tên session cũ bất kỳ; hermes sessions delete <ID> xóa một session.
  t354: hermes import khôi phục bản zip backup Hermes đầy đủ; bản xuất JSON/JSONL session được nhập từ trang Sessions của dashboard.
  t355: hermes fallback quản lý chuỗi fallback_model tương tác — không cần sửa tay config.yaml.
  t356: hermes pairing xoay vòng token ghép nối DM — người nhắn tin đầu tiên sau khi xoay sẽ chiếm quyền truy cập bot.
  t357: hermes setup dẫn người dùng lần đầu qua provider, key và kết nối nền tảng trong một luồng tương tác duy nhất.
  t358: hermes status --deep chạy quét sức khỏe toàn bộ mọi thành phần; hermes status thường là bản xem nhanh.
  t359: HERMES_AGENT_TIMEOUT=0 tắt cơ chế kill do không hoạt động của gateway với agent đang chạy — dùng cho các lượt nghiên cứu dài.
  t360: HERMES_ENABLE_PROJECT_PLUGINS=1 tự nạp plugin trong repo từ ./.hermes/plugins/ — được kiểm soát tin cậy theo thiết kế.
  t361: HERMES_DISABLE_FILE_STATE_GUARD=1 tắt cơ chế 'file đã đổi kể từ khi bạn đọc' trên patch và write_file.
  t362: HERMES_ALLOW_PRIVATE_URLS=true cho web tools chạm tới localhost và mạng riêng — tắt theo mặc định trong gateway mode.
  t363: HERMES_OPTIONAL_SKILLS=name1,name2 tự cài các skill catalog tùy chọn thêm vào ở lần chạy đầu theo profile.
  t364: HERMES_BUNDLED_SKILLS trỏ tới cây skill đóng gói tùy chỉnh — được Homebrew và Nix packaging dùng.
  t365: HERMES_DUMP_REQUEST_STDOUT=1 dump mọi payload yêu cầu API ra stdout thay vì file log.
  t366: HERMES_OAUTH_TRACE=1 ghi log các lần trao đổi và làm mới token OAuth đã che bớt để debug xác thực provider.
  t367: HERMES_STREAM_RETRIES (mặc định 3) kiểm soát số lần kết nối lại giữa luồng khi lỗi mạng tạm thời.
  t368: HERMES_GATEWAY_BUSY_ACK_ENABLED=false tắt các tin nhắn xác nhận ⚡/⏳/⏩ khi người dùng nhắn cho agent đang bận.
  t369: HERMES_AGENT_NOTIFY_INTERVAL (mặc định 180s) đặt tần suất gateway báo tiến độ trong các turn dài.
  t370: HERMES_RESTART_DRAIN_TIMEOUT (mặc định 900s) giới hạn thời gian /restart chờ các lượt chạy đang thực hiện trước khi buộc dừng.
  t371: HERMES_CHECKPOINT_TIMEOUT (mặc định 30s) giới hạn thời gian tạo checkpoint filesystem — tăng lên với monorepo lớn.
  t372: 'image_gen.model trong config.yaml chọn model FAL: flux-2/klein, gpt-image-2, nano-banana-pro và nhiều hơn nữa.'
  t373: image_gen.provider điều hướng sinh ảnh qua plugin (OpenAI Images, Codex, FAL) thay vì mặc định.
  t374: AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY trỏ phân tích vision tới endpoint tương thích OpenAI bất kỳ.
  t375: 'security.tirith_fail_open: false khiến Hermes chặn lệnh khi chính trình quét tirith gặp lỗi.'
  t376: Biến môi trường TIRITH_FAIL_OPEN ghi đè cấu hình tirith_fail_open — cách bật/tắt nhanh không cần sửa config.yaml.
  t377: Chat với --source tool bị loại khỏi hermes sessions list theo mặc định — đặt --source rõ ràng để thấy chúng.
  t378: Session ID có tiền tố dấu thời gian (20250305_091523_abcd) nên sắp xếp tự nhiên trong ls và jq.
  t379: API_SERVER_MODEL_NAME tùy biến tên model trên /v1/models — cần thiết cho thiết lập Open WebUI đa profile.
  t380: Plugin dashboard được phục vụ từ /dashboard-plugins/<name>/ — thả file vào ~/.hermes/dashboard-plugins/.
