    p11: Gõ / để duyệt các lệnh, hoặc Ctrl+P để mở palette
  t001: /bg <prompt> chạy một tác vụ trong session riêng trong khi session hiện tại vẫn rảnh; /btw <question> trả lời câu hỏi phụ về hội thoại này mà không làm gián đoạn.
  t002: /branch tách session hiện tại để bạn khám phá một hướng đi khác mà không mất tiến độ.
  t003: /compress nén thủ công context hội thoại khi nó trở nên quá dài.
  t004: /rollback liệt kê các checkpoint filesystem — khôi phục file mà agent đã sửa về bất kỳ trạng thái trước đó nào.
  t005: /rollback diff 2 xem trước những gì đã thay đổi kể từ checkpoint 2 mà không khôi phục gì.
  t006: /rollback 2 src/file.py khôi phục một file duy nhất từ checkpoint cụ thể.
  t007: /title "my project" đặt tên cho session — sau đó tiếp tục bằng /resume hoặc hermes -c.
  t008: /resume tiếp tục đúng chỗ bạn đang dở trong session đã đặt tên trước đó.
  t009: /queue <prompt> đưa tin nhắn vào hàng đợi cho lượt sau mà không gián đoạn lượt hiện tại.
  t010: /undo xóa lượt trao đổi user/assistant cuối cùng khỏi hội thoại.
  t011: /retry gửi lại tin nhắn cuối của bạn — hữu ích khi câu trả lời của agent chưa đúng lắm.
  t012: '/verbose luân phiên chế độ hiển thị tiến trình tool: off → new → all → verbose.'
  t013: /reasoning high tăng độ sâu suy luận của model. /reasoning show hiển thị phần suy luận.
  t014: /fast bật/tắt xử lý ưu tiên để nhận phản hồi API nhanh hơn (tùy provider).
  t015: /yolo bỏ qua mọi prompt phê duyệt lệnh nguy hiểm trong phần còn lại của session.
  t016: /model cho phép đổi model giữa session — thử /model sonnet hoặc /model gpt-5.
  t017: /model --global đổi model mặc định của bạn vĩnh viễn.
  t018: /personality pirate đặt một personality vui nhộn — 14 lựa chọn có sẵn từ kawaii đến shakespeare.
  t019: /skin đổi theme CLI — thử ares, mono, slate, poseidon hoặc charizard.
  t020: /statusbar bật/tắt thanh hiển thị thường trực model, token, % context đã dùng, chi phí và thời lượng.
  t021: /tools disable browser tạm gỡ các tool browser cho session hiện tại.
  t022: /browser connect gắn các tool browser vào trình duyệt họ Chromium đang chạy của bạn qua CDP.
  t023: /plugins liệt kê các plugin đã cài và trạng thái của chúng.
  t024: /cron quản lý các tác vụ định kỳ — thiết lập prompt lặp lại với gửi kết quả tới bất kỳ nền tảng nào.
  t025: /reload-mcp nạp lại cấu hình MCP server mà không cần khởi động lại.
  t026: /usage hiển thị mức dùng token, phân bổ chi phí và thời lượng session.
  t027: /insights hiển thị phân tích sử dụng trong 30 ngày gần nhất.
  t028: /paste kiểm tra clipboard của bạn có ảnh và đính kèm vào tin nhắn kế tiếp.
  t029: /profile hiển thị profile đang hoạt động và thư mục home của nó.
  t030: /config xem nhanh cấu hình hiện tại của bạn.
  t031: /stop kết thúc mọi tiến trình nền do agent khởi tạo.
  t032: '@file:path/to/file.py chèn nội dung file trực tiếp vào tin nhắn của bạn.'
  t033: '@file:main.py:10-50 chỉ chèn các dòng 10-50 của file.'
  t034: '@folder:src/ chèn cây thư mục dưới dạng danh sách.'
  t035: '@diff chèn các thay đổi git chưa staged vào tin nhắn.'
  t036: '@staged chèn các thay đổi git đã staged (git diff --staged).'
  t037: '@git:5 chèn 5 commit cuối cùng kèm toàn bộ patch.'
  t038: '@url:https://example.com lấy và chèn nội dung một trang web.'
  t039: Gõ @ sẽ kích hoạt hoàn thiện đường dẫn filesystem — điều hướng đến bất kỳ file nào một cách tương tác.
  t040: 'Kết hợp nhiều tham chiếu: "Review @file:main.py and @file:test.py for consistency."'
  t041: Alt+Enter chèn xuống dòng cho input nhiều dòng. (Windows Terminal chặn Alt+Enter — dùng Ctrl+Enter thay thế.)
  t042: Ctrl+C gián đoạn agent. Nhấn đúp trong 2 giây để thoát bắt buộc.
  t043: Ctrl+Z tạm dừng Hermes chạy nền — chạy fg trong shell để tiếp tục.
  t044: Tab chấp nhận text gợi ý mờ hoặc hoàn thiện lệnh slash.
  t045: Gõ tin nhắn mới trong khi agent đang chạy để gián đoạn và định hướng lại nó.
  t046: Alt+V dán ảnh từ clipboard vào hội thoại.
  t047: Dán 5+ dòng sẽ tự lưu thành file và chèn tham chiếu gọn thay thế.
  t048: hermes -c tiếp tục session CLI gần nhất của bạn. hermes -c "project name" tiếp tục theo tiêu đề.
  t049: hermes -w tạo một git worktree biệt lập — hoàn hảo cho các workflow agent song song.
  t050: 'hermes -w -q "Fix issue #42" kết hợp biệt lập worktree với một truy vấn một lần.'
  t051: hermes chat -t web,terminal chỉ bật các toolset cụ thể cho một session tập trung.
  t052: hermes chat -s github-pr-workflow nạp sẵn một skill khi khởi động.
  t053: hermes chat -q "query" chạy một truy vấn đơn không tương tác rồi thoát.
  t054: hermes chat --max-turns 1000 ghi đè giới hạn mặc định 500 lượt mỗi turn.
  t055: hermes chat --checkpoints bật chụp nhanh filesystem trước mọi thay đổi file gây phá hủy.
  t056: hermes --yolo bỏ qua mọi prompt phê duyệt lệnh nguy hiểm trong suốt session.
  t057: hermes chat --source telegram gắn thẻ session để lọc trong hermes sessions list.
  t058: hermes -p work chat chạy dưới một profile cụ thể mà không đổi mặc định của bạn.
  t059: hermes doctor --fix chẩn đoán và tự sửa các vấn đề cấu hình và phụ thuộc.
  t060: hermes dump xuất một bản tóm tắt thiết lập gọn — rất tiện cho báo cáo lỗi.
  t061: hermes config set KEY VALUE tự điều hướng secret vào .env và phần còn lại vào config.yaml.
  t062: hermes config edit mở config.yaml trong editor mặc định của bạn.
  t063: hermes config check quét các tùy chọn cấu hình bị thiếu hoặc cũ.
  t064: hermes sessions browse mở trình chọn session tương tác có tìm kiếm.
  t065: hermes sessions stats hiển thị số lượng session theo nền tảng và kích thước database.
  t066: hermes sessions prune --older-than 30 dọn các session cũ.
  t067: hermes skills search react --source skills-sh tìm kiếm trong thư mục công khai skills.sh.
  t068: hermes skills check quét các skill hub đã cài để tìm bản cập nhật từ nguồn gốc.
  t069: hermes skills tap add myorg/skills-repo thêm nguồn skill GitHub tùy chỉnh.
  t070: hermes skills snapshot export setup.json xuất cấu hình skill của bạn để sao lưu hoặc chia sẻ.
  t071: hermes mcp add github --command npx thêm MCP server từ dòng lệnh.
  t072: hermes mcp serve chạy chính Hermes như một MCP server cho các agent khác.
  t073: hermes auth add cho phép thêm nhiều API key để xoay vòng nhóm thông tin xác thực.
  t074: hermes completion bash >> ~/.bashrc bật hoàn thiện tab cho mọi lệnh và profile.
  t075: hermes logs -f theo dõi agent.log theo thời gian thực. --level WARNING --since 1h lọc đầu ra.
  t076: hermes backup tạo file zip sao lưu toàn bộ thư mục home Hermes của bạn.
  t077: hermes profile create coder tạo một profile biệt lập và biến nó thành lệnh riêng.
  t078: hermes profile create work --clone sao chép cấu hình và key hiện tại sang profile mới.
  t079: hermes update đồng bộ skill mới đóng gói sẵn đến TẤT CẢ các profile tự động.
  t080: hermes gateway install thiết lập Hermes như một dịch vụ hệ thống (systemd/launchd).
  t081: hermes memory setup cho phép cấu hình provider bộ nhớ ngoài (Honcho, Mem0, v.v.).
  t082: hermes webhook subscribe tạo các route webhook theo sự kiện với xác thực HMAC.
  t083: 'Tiết kiệm chi phí: hermes tools tắt các tool không dùng, hermes skills config cắt bớt skill.'
  t084: /reasoning low hoặc /reasoning minimal giảm độ sâu suy luận dưới mức mặc định (medium) — phản hồi nhanh hơn, rẻ hơn.
  t085: hermes models định tuyến tác vụ vision, nén và phụ trợ sang model rẻ hơn — cắt hơn 85% chi phí token nền mà không hạ model chat chính.
  t086: 'Đặt display.bell_on_complete: true trong config.yaml để nghe chuông khi các tác vụ dài hoàn tất.'
  t087: 'Đặt display.streaming: true để thấy token xuất hiện theo thời gian thực khi model sinh nội dung.'
  t088: 'Đặt display.show_reasoning: true để theo dõi chuỗi suy luận (chain-of-thought) của model.'
  t089: 'Đặt display.compact: true để giảm khoảng trắng trong đầu ra, thông tin dày hơn.'
  t090: 'Đặt display.busy_input_mode: queue để xếp hàng tin nhắn thay vì gián đoạn agent, hoặc steer để chèn giữa lúc chạy qua /steer.'
  t091: 'Đặt display.resume_display: minimal để bỏ qua phần tóm tắt lại toàn bộ hội thoại khi tiếp tục session.'
  t092: 'Đặt compression.threshold: 0.50 để kiểm soát thời điểm tự nén kích hoạt (mặc định: 50% context).'
  t093: 'Đặt agent.max_turns: 1000 để agent thực hiện nhiều bước gọi tool hơn mỗi lượt.'
  t094: 'Đặt file_read_max_chars: 200000 để tăng nội dung tối đa cho mỗi lần gọi read_file.'
  t095: 'Đặt approvals.mode: smart để LLM tự phê duyệt lệnh an toàn và tự từ chối lệnh nguy hiểm.'
  t096: Đặt fallback_model trong config.yaml để tự động chuyển sang provider dự phòng khi lỗi.
  t097: 'Đặt privacy.redact_pii: true để băm user ID và số điện thoại trước khi gửi cho LLM.'
  t098: 'Đặt browser.record_sessions: true để tự ghi các phiên browser thành video WebM.'
  t099: 'Đặt worktree: true trong config.yaml để luôn tạo git worktree (giống hermes -w).'
  t100: 'Đặt security.website_blocklist.enabled: true để chặn các tên miền cụ thể khỏi web tools.'
  t101: 'Đặt cron.wrap_response: false để gửi đầu ra thô của agent không kèm header/footer cron.'
  t102: HERMES_TIMEZONE ghi đè múi giờ server bằng chuỗi IANA bất kỳ.
  t103: 'Thay thế biến môi trường hoạt động trong config.yaml: dùng cú pháp ${VAR_NAME}.'
  t104: Quick commands trong config.yaml chạy lệnh shell tức thì, tốn 0 token.
  t105: Personality tùy chỉnh có thể định nghĩa trong config.yaml dưới agent.personalities.
  t106: provider_routing kiểm soát sắp xếp, whitelist và blacklist provider OpenRouter.
  t107: execute_code chạy script Python gọi các tool Hermes theo chương trình — kết quả không vào context.
  t108: delegate_task khởi tạo tới 10 sub-agent chạy đồng thời theo mặc định (delegation.max_concurrent_children) với context biệt lập cho công việc song song.
  t109: web_extract hoạt động với URL PDF — đưa link PDF bất kỳ và nó chuyển thành markdown.
  t110: search_files dựa trên ripgrep và nhanh hơn grep — hãy dùng nó thay cho grep trong terminal.
  t111: patch dùng 9 chiến lược khớp mờ nên khác biệt nhỏ về khoảng trắng không làm hỏng việc sửa.
  t112: patch hỗ trợ định dạng V4A để sửa nhiều file hàng loạt trong một lần gọi.
  t113: read_file gợi ý tên file tương tự khi không tìm thấy file.
  t114: read_file tự khử trùng lặp — đọc lại file không đổi sẽ trả về stub nhẹ.
  t115: browser_vision chụp ảnh màn hình và phân tích bằng AI — dùng được cho CAPTCHA và nội dung trực quan.
  t116: browser_console có thể chạy biểu thức JavaScript trong ngữ cảnh trang.
  t117: image_generate tạo ảnh với FLUX 2 Pro và tự động upscale 2x.
  t118: text_to_speech chuyển text thành âm thanh — hiển thị bong bóng voice trên Telegram.
  t119: send_message có thể gửi đến mọi nền tảng nhắn tin đã kết nối ngay trong session.
  t120: Tool todo giúp agent theo dõi các tác vụ nhiều bước phức tạp trong session.
  t121: session_search tìm kiếm toàn văn trên TẤT CẢ các hội thoại trước đây.
  t122: Agent tự lưu lựa chọn, chỉnh sửa và thông tin môi trường vào memory.
  t123: /moa điều phối một prompt khó qua bộ model Mixture of Agents đã cấu hình.
  t124: Lệnh terminal hỗ trợ chế độ nền với notify_on_complete cho tác vụ chạy dài.
  t125: Tiến trình nền terminal hỗ trợ watch_patterns để báo động theo dòng đầu ra cụ thể.
  t126: 'Tool terminal hỗ trợ 6 backend: local, Docker, SSH, Modal, Daytona và Singularity.'
  t127: Mỗi profile có config, API key, memory, session, skill và cron job riêng.
  t128: Tên profile trở thành lệnh shell — 'hermes profile create coder' tạo ra lệnh 'coder'.
  t129: hermes profile export coder -o backup.tar.gz tạo một bản lưu trữ profile di động.
  t130: Nếu hai profile vô tình dùng chung bot token, gateway thứ hai bị chặn kèm thông báo lỗi rõ ràng.
  t131: Session tự sinh tiêu đề mô tả sau lượt trao đổi đầu tiên — không cần đặt tên thủ công.
  t132: 'Tiêu đề session hỗ trợ dòng dõi: "my project" → "my project #2" → "my project #3".'
  t133: Khi thoát, Hermes in lệnh tiếp tục kèm session ID và số liệu.
  t134: hermes sessions export backup.jsonl xuất mọi session để sao lưu hoặc phân tích.
  t135: hermes -r SESSION_ID tiếp tục một session trước đó bất kỳ theo ID của nó.
  t136: Memory là ảnh chụp cố định — thay đổi chỉ xuất hiện trong system prompt ở lần chạy session kế tiếp.
  t137: Các mục memory tự động được quét theo mẫu prompt injection và rò rỉ dữ liệu.
  t138: 'Agent có hai kho memory: ghi chú cá nhân (~2200 ký tự) và user profile (~1375 ký tự).'
  t139: Các chỉnh sửa bạn đưa cho agent ("không, làm kiểu này") thường được tự lưu vào memory.
  t140: Hơn 80 skill đóng gói sẵn phủ github, creative, mlops, productivity, research và nhiều hơn nữa.
  t141: Mọi skill đã cài tự động trở thành lệnh slash — gõ / để xem tất cả.
  t142: hermes skills install official/security/1password cài các skill tùy chọn từ repo.
  t143: Skill có thể giới hạn trên hệ điều hành cụ thể — một số chỉ tải trên macOS hoặc Linux.
  t144: skills.external_dirs trong config.yaml cho phép tải skill từ thư mục tùy chỉnh.
  t145: Agent có thể tự tạo skill của mình như bộ nhớ thủ tục (procedural memory) qua skill_manage.
  t146: /plan viết kế hoạch triển khai dạng markdown vào .hermes/plans/ mà không thực thi gì.
  t147: 'Cron job có thể gắn skill: hermes cron add --skill blogwatcher "Check for new posts".'
  t148: Đích gửi của cron bao gồm telegram, discord, slack, email, sms và hơn 12 nền tảng nữa.
  t149: Nếu phản hồi cron bắt đầu bằng [SILENT], việc gửi bị ẩn đi — hữu ích cho job chỉ theo dõi.
  t150: Cron hỗ trợ độ trễ tương đối (30m), chu kỳ (every 2h), biểu thức cron và mốc thời gian ISO.
  t151: Cron job chạy trong session agent hoàn toàn mới — prompt phải tự chứa đầy đủ ngữ cảnh.
  t152: Voice mode hoạt động mà không cần API key nếu faster-whisper đã cài (speech-to-text địa phương miễn phí).
  t153: 'Năm TTS provider khả dụng: Edge TTS (miễn phí), ElevenLabs, OpenAI, NeuTTS (chạy local miễn phí), MiniMax.'
  t154: /voice on bật voice mode trong CLI. Ctrl+B bật/tắt ghi âm push-to-talk.
  t155: Streaming TTS đọc từng câu ngay khi sinh — bạn không phải đợi toàn bộ phản hồi.
  t156: Tin nhắn voice trên Telegram, Discord, WhatsApp và Slack được tự động phiên âm.
  t157: 'Hermes chạy trên 21 nền tảng nhắn tin: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email và nhiều hơn nữa.'
  t158: hermes gateway install thiết lập Hermes thành dịch vụ hệ thống khởi động cùng máy.
  t159: DingTalk dùng Stream Mode — không cần webhook hay URL công khai.
  t160: BlueBubbles đưa iMessage đến Hermes qua một server macOS chạy local.
  t161: Route webhook hỗ trợ xác thực HMAC, giới hạn tốc độ và lọc sự kiện.
  t162: API server cung cấp endpoint tương thích OpenAI, dùng được với Open WebUI và LibreChat.
  t163: 'Chế độ kênh voice Discord: bot vào phòng voice, phiên âm lời nói và trả lời bằng giọng nói.'
  t164: 'group_sessions_per_user: true cho mỗi người một session riêng trong group chat.'
  t165: /sethome đánh dấu một chat là kênh home để nhận kết quả cron job.
  t166: Gateway hỗ trợ timeout dựa trên không hoạt động — agent đang chạy có thể chạy vô thời hạn.
  t167: 'Phê duyệt lệnh nguy hiểm có 4 mức: once, session, always (cho phép vĩnh viễn), deny.'
  t168: Chế độ phê duyệt thông minh dùng LLM để tự phê duyệt lệnh an toàn và đánh dấu lệnh nguy hiểm.
  t169: Bảo vệ SSRF chặn mạng riêng, loopback, link-local và địa chỉ metadata cloud.
  t170: Quét pre-exec của Tirith phát hiện giả mạo URL homograph và mẫu pipe-to-interpreter.
  t171: Tiến trình con MCP nhận môi trường đã lọc — chỉ các biến hệ thống an toàn được đi qua.
  t172: File context (.hermes.md, AGENTS.md) được quét bảo mật prompt injection trước khi nạp.
  t173: command_allowlist trong config.yaml phê duyệt vĩnh viễn các mẫu lệnh shell cụ thể.
  t174: Context tự nén khi đạt ngưỡng — memory được flush và lịch sử được tóm tắt.
  t175: Thanh trạng thái chuyển vàng, rồi cam, rồi đỏ khi context lấp đầy.
  t176: SOUL.md là file định danh chính của agent — tùy biến nó để định hình hành vi.
  t177: Hermes nạp context dự án từ .hermes.md, AGENTS.md, CLAUDE.md hoặc .cursorrules (khớp đầu tiên).
  t178: File AGENTS.md trong thư mục con được phát hiện dần khi agent đi vào từng thư mục.
  t179: File context bị giới hạn 20.000 ký tự với cơ chế cắt head/tail thông minh.
  t180: 'Năm browser provider: Chromium local, Browserbase, Browser Use, Camofox và Firecrawl.'
  t181: Camofox là trình duyệt chống phát hiện — bản fork Firefox với giả lập fingerprint bằng C++.
  t182: browser_navigate tự trả về snapshot trang — không cần gọi browser_snapshot sau đó.
  t183: browser_vision với annotate=true phủ nhãn số lên các phần tử tương tác.
  t184: hermes mcp mở trình chọn tương tác các MCP được Nous phê duyệt, cài chỉ với một phím.
