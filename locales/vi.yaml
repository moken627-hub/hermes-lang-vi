explainer:
  empty_response: '{model} không tạo được phản hồi trong lần này, kể cả sau khi đã thử lại. Gửi `continue` để thử lại, hoặc đổi model bằng /model.'
  exit:
    all_retries_exhausted_no_response: không nhận được phản hồi nào từ provider sau mọi lần thử lại. Gửi /retry, hoặc đổi model bằng /model.
    budget_exhausted: ngân sách số lượt lặp/chi phí mỗi lượt đã cạn trước khi có câu trả lời cuối. Gửi `continue` để tiếp tục.
    error_near_max_iterations: đã xảy ra lỗi gần giới hạn số lượt lặp trước khi có câu trả lời cuối. Kiểm tra output công cụ ở trên, rồi gửi `continue`.
    fallback_prior_turn_content: không có nội dung mới nào được tạo trong lượt này; đang hiển thị lại ngữ cảnh đã khôi phục của lượt trước. Gửi `continue` để thử lại.
    interrupted_during_api_call: yêu cầu bị gián đoạn giữa lúc gọi API trước khi nhận được phản hồi. Gửi `continue` để thử lại.
    max_iterations_reached: đã đạt giới hạn tối đa số lượt lặp công cụ trước khi có câu trả lời cuối. Gửi `continue` để tiếp tục, hoặc tăng `max_iterations`.
    ollama_runtime_context_too_small: cửa sổ ngữ cảnh của model cục bộ quá nhỏ để hoàn tất. Tăng kích thước ngữ cảnh hoặc dùng model lớn hơn.
    partial_stream_recovery: streaming dừng sớm và chỉ khôi phục được một phần phản hồi. Gửi `continue` để tiếp tục từ điểm dừng.
    pending_tool_result: lượt đã dừng khi kết quả công cụ vẫn đang chờ và model không tạo thêm văn bản nào. Gửi `continue` để nó tóm tắt.
    rebuilt_restart_limit_exceeded: mọi provider trong chuỗi fallback liên tục lỗi nên phải chuyển sang provider dự phòng, khiến lượt đã dừng thay vì thử lại vô hạn. Gửi `continue` hoặc đổi provider.
    redirect_restart_limit_exceeded: yêu cầu bị hủy bởi một yêu cầu chỉnh sửa mới trong mọi lần thử, nên lượt đã dừng thay vì thử lại vô hạn. Yêu cầu chỉnh sửa cuối cùng của bạn đã được xếp hàng làm tin nhắn tiếp theo.
    repeated_outer_errors: lượt liên tục gặp lỗi lặp lại và đã bị dừng sớm thay vì thử lại vô hạn. Kiểm tra các lỗi ở trên, rồi gửi `continue` để thử lại.
  file_mutation:
    entry: '  • `{path}` — [{tool}] {preview}'
    failed: thất bại
    header: '⚠️ Trình xác minh thay đổi tệp: {count} lần sửa tệp ĐÃ THẤT BẠI trong lượt này, bất chấp bất kỳ diễn đạt nào ở trên có thể khiến bạn nghĩ điều ngược lại. Chạy `git status` hoặc `read_file` để xác nhận những gì thực sự được ghi.'
  no_reply_prefix: '⚠️ Không có phản hồi: '
  persistence:
    compression: lượt đã bị dừng vì một tiến trình khác đang nén phiên này. Tin nhắn của bạn có lẽ đã được lưu — vui lòng gửi lại sau khi quá trình nén hoàn tất.
    compression_closed: lượt đã bị dừng vì phiên này đã được thay thế bởi quá trình nén ngữ cảnh và phần chạy tiếp theo của nó không thể được tiếp nhận. Bản lưu trữ vẫn khỏe mạnh — hãy làm mới client (hoặc bắt đầu một lượt mới) để nó nhận session id mới, rồi gửi lại tin nhắn của bạn.
    corrupt: lượt đã bị dừng vì cơ sở dữ liệu trạng thái báo hỏng cấu trúc (bản ghi hội thoại sẽ bị mất khi khởi động lại). Giải phóng dung lượng đĩa sẽ không giúp được gì. Các cách khôi phục:\n1. Chạy `hermes {profile_arg}doctor --fix`\n2. Dừng gateway, rồi khôi phục bằng:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (nếu báo có thể khôi phục) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — khôi phục sẽ chụp bản sao tệp bị hỏng trước tiên; KHÔNG chạy `sqlite3 ... ".recover"` trên state.db đang chạy, sqlite3 CLI có lỗ hổng có thể làm hỏng thêm\n3. Khôi phục từ bản sao lưu trong {backups_dir}/\nSau đó gửi lại tin nhắn của bạn.
    default: 'Hermes không thể lưu hội thoại này, nên đã dừng thay vì mất tin nhắn của bạn. Nguyên nhân có thể: ổ đĩa hết dung lượng, hoặc một tiến trình Hermes khác đang giữ cơ sở dữ liệu. Đóng các cửa sổ Hermes khác, chạy `hermes {profile_arg}doctor` để kiểm tra bộ lưu trữ, rồi gửi lại tin nhắn của bạn.'
    deleted_wal: 'một tiến trình Hermes khác vẫn đang giữ bản sao cũ của write-ahead log trong cơ sở dữ liệu phiên, nên Hermes đã ngừng ghi để giữ an toàn cho tệp và tin nhắn này chưa được lưu (một bản sao được giữ trong {home}/sessions/). Không có gì bị mất. Thoát mọi tiến trình Hermes trên profile này (ứng dụng Desktop, `hermes {profile_arg}gateway stop`, dashboard, cron), chạy `hermes {profile_arg}doctor` — nó sẽ chỉ ra tiến trình nào vẫn đang giữ log — rồi khởi động Hermes lại và gửi lại tin nhắn của bạn một lần nữa. Không chạy `doctor --fix` hay xóa bất kỳ tệp state.db nào trong lúc các tiến trình đó còn chạy. Hướng dẫn: {recovery_docs}'
    disk: 'Hermes không thể lưu hội thoại này vào đĩa, nên đã dừng thay vì mất tin nhắn của bạn. Ổ đĩa có lẽ đã đầy: hãy giải phóng bớt dung lượng (hoặc sửa quyền truy cập trên {home}/state.db), rồi gửi lại tin nhắn của bạn.'
    fts_index: 'lượt đã bị dừng vì chỉ mục tìm kiếm phiên (FTS5) bị hỏng và không thể tách ra, nên tin nhắn này chưa được lưu. Kho tin nhắn không bị hư hại: đừng chạy công cụ khôi phục hay phục hồi bản sao lưu. Chạy `hermes {profile_arg}doctor --fix` (hoặc khởi động lại Hermes, chỉ mục sẽ được sửa khi mở), rồi gửi lại tin nhắn của bạn.'
    locked: lượt đã bị dừng vì bộ lưu trữ phiên đang bận (một tiến trình Hermes khác đang ghi vào cơ sở dữ liệu trạng thái). Tin nhắn của bạn có lẽ đã được lưu — vui lòng đợi một lúc rồi gửi lại.
    replaced: tệp cơ sở dữ liệu phiên đã bị thay thế trong khi Hermes đang chạy, nên tin nhắn này chưa được lưu (một bản sao được giữ trong {home}/sessions/). Dừng Hermes (`hermes {profile_arg}gateway stop`), chạy `hermes {profile_arg}doctor` — không phải `hermes {profile_arg}doctor --fix`, vì lệnh đó sẽ sửa nhầm tệp ngay tại chỗ — rồi khởi động lại và gửi tin nhắn của bạn một lần nữa. Các bước khôi phục nâng cao có trong log.
    session_row_missing: phiên này đã bị xóa khỏi bộ lưu trữ trong khi hội thoại vẫn đang mở, và Hermes không thể tạo lại nó, nên tin nhắn này chưa được lưu. Hãy gửi lại tin nhắn của bạn; nếu vẫn tiếp tục thất bại, chạy `hermes {profile_arg}doctor`.
    turn_lease: lượt đã bị dừng vì một tiến trình Hermes khác đã tiếp quản phiên này. Phản hồi của bạn chưa được lưu — hãy đợi tiến trình kia hoàn tất, rồi gửi lại tin nhắn của bạn.
