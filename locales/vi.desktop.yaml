"sharedMetrics.collectDesc": "Các bộ đếm có giới hạn, lưu trên máy này. Không bao giờ gồm prompt, tệp, đường dẫn hay nội dung lỗi."
"sharedMetrics.collectLabel": "Thu thập số liệu sử dụng"
"sharedMetrics.collectedActivity": "Hoạt động, độ dài phiên, kết quả và nhóm lỗi"
"sharedMetrics.collectedIntro": "Chỉ các bộ đếm có giới hạn:"
"sharedMetrics.collectedMachine": "Thông tin máy ở mức khái quát: khoảng RAM, loại GPU, độ mới của phiên bản Hermes và kênh phát hành, số bản cập nhật còn thiếu, có dùng máy chủ model cục bộ hay không"
"sharedMetrics.collectedMilestones": "Số liệu thiết lập theo nhóm"
"sharedMetrics.collectedModels": "Tuyến model và tổng token"
"sharedMetrics.collectedNames": "Tên công cụ, lệnh và danh mục có sẵn"
"sharedMetrics.collectedReliability": "Kết quả và thời gian cập nhật, các lần dừng đột ngột, tốc độ khởi động và phản hồi, tình trạng nền tảng nhắn tin"
"sharedMetrics.collectedUsage": "Cách Hermes được sử dụng: độ chính xác và hiệu quả của agent (chỉnh sửa khớp, vòng lặp, phục hồi, token và số lần gọi công cụ mỗi tác vụ, gián đoạn cache), thời gian hoạt động theo từng khu vực và chế độ Desktop, khu vực ứng dụng, hành động và cài đặt nào được dùng, cái nào bị đóng nhanh hoặc tắt, cùng kết quả thiết lập nhà cung cấp"
"sharedMetrics.consentBody": "Số liệu chia sẻ chỉ gồm các bộ đếm có giới hạn. Không bao giờ có prompt, tệp, đường dẫn hay nội dung lỗi. Việc thu thập diễn ra cục bộ. Gửi chúng cho Nous là một lựa chọn riêng."
"sharedMetrics.consentTitle": "Giúp cải thiện Hermes?"
"sharedMetrics.consentWindow": "Chỉ những gói có toàn bộ thời gian thu thập nằm trong khoảng đã đồng ý mới được gửi — dữ liệu từ trước khi bạn đồng ý, hoặc trong khoảng thời gian đã tắt gửi, vẫn nằm trên máy này. Bạn có thể tắt gửi lại bất cứ lúc nào."
"sharedMetrics.installId": "Việc gửi sẽ tải từng gói hằng ngày lên dịch vụ telemetry của Nous. Mỗi gói mang install ID của hồ sơ này: một UUID ngẫu nhiên cố định, không chứa thông tin cá nhân, được đặt lại bằng cách xóa thư mục shared-metrics."
