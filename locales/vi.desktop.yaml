"settings.fieldDescriptions.browser.useRealProfile": "Duyệt web cục bộ dùng thông tin đăng nhập thật của bạn. Hermes sao chép hồ sơ trình duyệt mặc định của bạn (cookie, thông tin đăng nhập, tùy chọn) vào một bản chụp được quản lý và điều khiển nó bằng Chromium đóng gói sẵn — hồ sơ đang dùng của bạn không bao giờ bị mở trực tiếp, và bản sao được làm mới từ đó mỗi lần chạy. Cũng cho phép agent mở một phiên dùng hồ sơ thật cục bộ theo yêu cầu ngay cả khi đã cấu hình backend trình duyệt đám mây. Chỉ hỗ trợ trình duyệt Chromium (Chrome, Edge, Brave, Brave Origin, Chromium); mặc định không phải Chromium sẽ lỗi với thông báo rõ ràng. Mặc định tắt."
